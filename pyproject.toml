[project]
name = "vingo-scraper"
version = "0.1.0"
description = "Facebook Marketplace ingestion for Vingo"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
vingo-probe = "vingo_scraper.cli:probe"
vingo-login = "vingo_scraper.cli:login"
vingo-scrape = "vingo_scraper.cli:scrape"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vingo_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: (str, Enum) is deliberate -- it keeps Pydantic serializing these
# as plain strings across versions. StrEnum changes that behaviour.
ignore = ["UP042"]
